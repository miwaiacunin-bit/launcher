name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Unpack project
        run: |
          ZIP=$(find . -iname 'MyLauncher*.zip' | head -1)
          echo "Found zip: $ZIP"
          unzip -q -o "$ZIP" -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "Project dir: $D"
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
